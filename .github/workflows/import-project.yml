name: Importar Biblioteca das Sombras

on:
  push:
    paths:
      - "Biblioteca-das-Sombras.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -q "Biblioteca-das-Sombras.zip" -d /tmp/biblioteca
          rsync -a \
            --exclude='.git/' \
            --exclude='.conversation/' \
            --exclude='.agents/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='*.tsbuildinfo' \
            --exclude='*.map' \
            /tmp/biblioteca/Biblioteca-das-Sombras/ ./

      - name: Remover ZIP
        run: rm -f "Biblioteca-das-Sombras.zip"

      - name: Salvar projeto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importar Biblioteca das Sombras" || exit 0
          git push
